name: CORE MR - Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CORE MR APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unity Project
        shell: bash
        run: |
          if [ ! -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "ERRO: ProjectSettings/ProjectVersion.txt não existe."
            exit 1
          fi

          if [ ! -f "Packages/manifest.json" ]; then
            echo "ERRO: Packages/manifest.json não existe."
            exit 1
          fi

          if [ ! -f "Assets/Editor/AndroidBuild.cs" ]; then
            echo "ERRO: Assets/Editor/AndroidBuild.cs não existe."
            exit 1
          fi

          echo "Projeto Unity encontrado."
          cat ProjectSettings/ProjectVersion.txt

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: core-mr-library-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            core-mr-library-

      - name: Build CORE MR APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: auto
          projectPath: .
          buildMethod: CoreMR.Editor.AndroidBuild.Build
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true

      - name: Find APK
        if: always()
        shell: bash
        run: |
          find . -type f -name "*.apk" -print
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CORE-MR-APK-${{ github.run_number }}
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
