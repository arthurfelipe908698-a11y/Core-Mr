name: Build Core MR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Core MR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download MediaPipe model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -o app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

          test -s app/src/main/assets/hand_landmarker.task

          echo "MediaPipe model:"
          ls -lh app/src/main/assets/hand_landmarker.task

      - name: Build base APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare 100 MB APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET=$((100 * 1024 * 1024))
          CURRENT=$(stat -c%s "$APK")

          echo "Current APK: $CURRENT bytes"
          echo "Target: $TARGET bytes"

          if [ "$CURRENT" -lt "$TARGET" ]; then
            NEED=$((TARGET - CURRENT + 2097152))

            echo "Creating $NEED bytes of temporary data..."

            mkdir -p app/src/main/assets/runtime

            python3 -c "import os,sys; size=int(sys.argv[1]); f=open('app/src/main/assets/runtime/core_mr_runtime.dat','wb'); remaining=size; chunk=1024*1024; [f.write(os.urandom(min(chunk,remaining))) or None for _ in iter(int,1) if not (remaining:=remaining-min(chunk,remaining))]; f.close()" "$NEED"

            ls -lh app/src/main/assets/runtime/core_mr_runtime.dat
          else
            echo "APK already has at least 100 MiB."
          fi

      - name: Build final APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET=$((100 * 1024 * 1024))
          SIZE=$(stat -c%s "$APK")

          echo "================================"
          echo "CORE MR APK"
          echo "================================"
          echo "APK size: $SIZE bytes"
          echo "APK size: $((SIZE / 1024 / 1024)) MiB"

          if [ "$SIZE" -lt "$TARGET" ]; then
            echo "::error::APK is smaller than 100 MiB."
            exit 1
          fi

          echo "APK OK!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-MR-APK-100MB
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
