name: CORE MR - Android APK

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build CORE MR APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity project
        shell: bash
        run: |
          echo "Verificando projeto Unity..."

          if [ ! -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "ERRO: ProjectSettings/ProjectVersion.txt não encontrado."
            echo ""
            echo "Este repositório precisa conter um projeto Unity completo."
            echo "Crie/adicione:"
            echo "  ProjectSettings/ProjectVersion.txt"
            echo "  ProjectSettings/ProjectSettings.asset"
            echo "  Packages/manifest.json"
            exit 1
          fi

          echo "Projeto Unity encontrado."

          echo "Versão do Unity:"
          cat ProjectSettings/ProjectVersion.txt

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: >-
            unity-library-android-${{ hashFiles(
              'ProjectSettings/ProjectVersion.txt',
              'Packages/manifest.json'
            ) }}
          restore-keys: |
            unity-library-android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

        with:
          targetPlatform: Android

          androidExportType: androidPackage

          buildMethod: CoreMR.Editor.AndroidBuild.Build

          versioning: None

          allowDirtyBuild: true

      - name: Verify APK
        shell: bash
        run: |
          echo "Procurando APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CORE-MR-APK-${{ github.run_number }}
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 14
