name: Build APK from VR-BOX-MR ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "VR-BOX-MR-1MB-CADA.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar ZIP
        shell: bash
        run: |
          set -e
          if [ ! -f "VR-BOX-MR-1MB-CADA.zip" ]; then
            echo "ERRO: VR-BOX-MR-1MB-CADA.zip não foi encontrado na raiz do repositório."
            exit 1
          fi
          unzip -l "VR-BOX-MR-1MB-CADA.zip"

      - name: Extrair o projeto web
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "VR-BOX-MR-1MB-CADA.zip" -d extracted

          SOURCE="extracted/VR-BOX-MR"

          if [ ! -f "$SOURCE/index.html" ]; then
            echo "ERRO: index.html não foi encontrado dentro de VR-BOX-MR-1MB-CADA.zip."
            find extracted -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Arquivos encontrados:"
          find "$SOURCE" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/coremr/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Core-Mr"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.coremr.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.coremr.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#050509</item>
                  <item name="android:statusBarColor">#050509</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Core MR"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/coremr/app/MainActivity.java <<'EOF'
          package com.coremr.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.Nullable;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private static final int CAMERA_PERMISSION = 100;
              private WebView webView;
              private WebViewAssetLoader assetLoader;

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  hideSystemUi();

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.CAMERA},
                          CAMERA_PERMISSION
                      );
                  }

                  createWebView();
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              private void createWebView() {
                  webView = new WebView(this);
                  setContentView(webView);

                  assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler(
                          "/assets/",
                          new WebViewAssetLoader.AssetsPathHandler(this)
                      )
                      .build();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(
                          WebView view,
                          WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(
                          final PermissionRequest request) {
                          runOnUiThread(() -> {
                              request.grant(request.getResources());
                          });
                      }
                  });

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          SOURCE="extracted/VR-BOX-MR"

          # Copia exatamente os arquivos que estavam dentro do ZIP.
          cp -R "$SOURCE"/. app/src/main/assets/

          echo "Assets do APK:"
          find app/src/main/assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-Mr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
