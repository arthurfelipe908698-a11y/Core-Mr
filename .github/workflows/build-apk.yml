name: Build Core MR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto Android
        run: |
          set -e
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: projeto Gradle Android não encontrado."
            echo "Arquivos na raiz:"
            ls -la
            exit 1
          fi
          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            ls -la
            exit 1
          fi

      - name: Compilar APK
        run: |
          set -e
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verificar APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-MR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
