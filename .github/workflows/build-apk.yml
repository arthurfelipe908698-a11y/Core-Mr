name: Build Core MR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Core MR
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do projeto
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configura Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Instala/configura Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Baixa o modelo Hand Tracking somente durante o build
      - name: Download MediaPipe Hand Tracking model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            -o app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

          test -s app/src/main/assets/hand_landmarker.task

          echo "Modelo MediaPipe:"
          ls -lh app/src/main/assets/hand_landmarker.task

      # 5. Compila o APK inicial
      - name: Build base APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 6. Confere o tamanho do APK
      - name: Check APK size
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK não foi gerado."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "Tamanho do APK:"
          echo "$SIZE bytes"
          echo "$((SIZE / 1024 / 1024)) MiB"

      # 7. Cria o preenchimento somente no servidor do GitHub
      #    Ele NÃO vai para o repositório.
      - name: Prepare APK for 100 MiB
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          TARGET=$((100 * 1024 * 1024))
          CURRENT=$(stat -c%s "$APK")

          echo "APK atual: $CURRENT bytes"
          echo "Meta: $TARGET bytes"

          if [ "$CURRENT" -ge "$TARGET" ]; then
            echo "APK já possui pelo menos 100 MiB."
            exit 0
          fi

          # Margem extra para garantir que o APK final
          # fique acima de 100 MiB depois da recompilação.
          NEED=$((TARGET - CURRENT + 2097152))

          echo "Será criado aproximadamente:"
          echo "$NEED bytes de dados temporários."

          mkdir -p app/src/main/assets/runtime

          python3 - "$NEED" <<'PY'
from pathlib import Path
import os
import sys

size = int(sys.argv[1])

output = Path(
    "app/src/main/assets/runtime/core_mr_runtime.dat"
)

chunk_size = 1024 * 1024
remaining = size

with output.open("wb") as file:
    while remaining > 0:
        amount = min(chunk_size, remaining)
        file.write(os.urandom(amount))
        remaining -= amount

print(f"Arquivo temporário criado: {size} bytes")
PY

          ls -lh app/src/main/assets/runtime/core_mr_runtime.dat

      # 8. Compila novamente o APK
      - name: Build final APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 9. Confere se realmente ficou >= 100 MiB
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK final não foi encontrado."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "========================================"
          echo "        CORE MR - APK FINAL"
          echo "========================================"
          echo ""
          echo "Arquivo: $APK"
          echo "Tamanho: $SIZE bytes"
          echo "Tamanho: $((SIZE / 1024 / 1024)) MiB"
          echo ""

          if [ "$SIZE" -lt "$((100 * 1024 * 1024))" ]; then
            echo "::error::O APK ficou abaixo de 100 MiB."
            exit 1
          fi

          echo "OK: APK possui pelo menos 100 MiB."

      # 10. Mostra informações do APK
      - name: APK information
        shell: bash
        run: |
          echo "APK gerado:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 11. Disponibiliza o APK para baixar no GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-MR-APK-100MB
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
