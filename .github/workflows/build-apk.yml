name: Build APK - Core MR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Core MR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check ZIP
        shell: bash
        run: |
          set -e
          echo "Arquivos do repositório:"
          ls -lah

          if [ ! -f "VR-BOX-MR-1MB-CADA.zip" ]; then
            echo "::error::VR-BOX-MR-1MB-CADA.zip não encontrado."
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "VR-BOX-MR-1MB-CADA.zip"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          unzip -q "VR-BOX-MR-1MB-CADA.zip" -d project

          echo "Conteúdo extraído:"
          find project -maxdepth 4 -type f | sort

          INDEX=$(find project -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "::error::Nenhum index.html foi encontrado dentro do ZIP."
            exit 1
          fi

          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "index.html encontrado em: $INDEX"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/coremr/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Core-Mr"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.coremr.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.coremr.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#050509</item>
                  <item name="android:statusBarColor">#050509</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Core MR"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/coremr/app/MainActivity.java <<'EOF'
          package com.coremr.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.Nullable;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private static final int CAMERA_REQUEST = 100;
              private WebView webView;
              private WebViewAssetLoader assetLoader;

              @Override
              protected void onCreate(@Nullable Bundle state) {
                  super.onCreate(state);

                  hideSystemUi();

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.CAMERA},
                          CAMERA_REQUEST
                      );
                  }

                  setupWebView();
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              private void setupWebView() {
                  webView = new WebView(this);
                  setContentView(webView);

                  assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler(
                          "/assets/",
                          new WebViewAssetLoader.AssetsPathHandler(this)
                      )
                      .build();

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                          WebView view,
                          WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(
                              request.getUrl()
                          );
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(
                          final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (request != null) {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Copy ZIP files into APK
        shell: bash
        run: |
          set -e

          INDEX="$INDEX"
          SOURCE_DIR="$(dirname "$INDEX")"

          echo "Copiando projeto web de:"
          echo "$SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. app/src/main/assets/

          if [ ! -f app/src/main/assets/index.html ]; then
            echo "::error::index.html não foi copiado para os assets."
            exit 1
          fi

          echo "Assets finais:"
          find app/src/main/assets -maxdepth 2 -type f | sort

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug --no-daemon --stacktrace

          echo "===== APKs GERADOS ====="
          find . -type f -name "*.apk" -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::O APK não foi encontrado em $APK"
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-Mr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK com nome fácil
        uses: actions/upload-artifact@v4
        with:
          name: Core-Mr-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
