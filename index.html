<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App VR - Realidade Mista & Mãos</title>
    <!-- Importando A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        .a-enter-vr, .a-enter-vr-modal, .a-modal {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Ativa o modo WebXR exigindo recursos de mãos e floor-space -->
    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: hand-tracking, dom-overlay; overlayElement: #overlay;" vr-mode-ui="enabled: true">
        
        <!-- Câmera e Controladores de Mão WebXR -->
        <a-entity id="rig">
            <a-camera position="0 1.6 0">
                <a-cursor raycaster="objects: [hand-interactive]" fuse="false"></a-cursor>
            </a-camera>
            
            <!-- Mão Esquerda e Direita com rastreamento real via WebXR -->
            <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
            <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;"></a-entity>
        </a-entity>

        <!-- Objeto 3D Interativo (Cubo Principal) -->
        <a-box id="cuboPrincipal" position="0 1.5 -1.2" rotation="0 45 45" color="#4CC3D9" shadow 
               hand-interactive
               animation="property: rotation; to: 360 360 0; loop: true; dur: 10000">
        </a-box>

        <!-- Interface Flutuante (HUD) -->
        <a-entity position="0 1.6 -1.2">
            <a-plane width="1.0" height="0.5" color="#000000" opacity="0.6" position="0 0 0"></a-plane>
            <a-text value="Hand Tracking Ativo" align="center" position="0 0.15 0.01" scale="0.4 0.4 0.4" color="#FFF"></a-text>
            
            <!-- Botão Cor -->
            <a-box id="btnMudarCor" position="-0.25 -0.08 0.02" width="0.35" height="0.12" depth="0.05" color="#4CC3D9" hand-interactive>
                <a-text value="Cor" align="center" position="0 0 0.03" scale="0.35 0.35 0.35" color="#000"></a-text>
            </a-box>

            <!-- Botão Reset -->
            <a-box id="btnResetar" position="0.25 -0.08 0.02" width="0.35" height="0.12" depth="0.05" color="#EF2D5E" hand-interactive>
                <a-text value="Reset" align="center" position="0 0 0.03" scale="0.35 0.35 0.35" color="#FFF"></a-text>
            </a-box>
        </a-entity>

        <!-- Iluminação e Ambiente -->
        <a-light type="ambient" color="#BBB"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="-0.5 1 1"></a-light>
    </a-scene>

    <script>
        // Remove avisos de 3DoF
        setInterval(() => {
            document.querySelectorAll('.a-modal, div[id^="aframe-"]:not(canvas)').forEach(el => {
                if(el.innerText && (el.innerText.includes('3DoF') || el.innerText.includes('Continuar'))) {
                    el.style.display = 'none';
                }
            });
        }, 500);
    </script>

    <!-- Scripts atualizados -->
    <script src="interaction.js"></script>
    <script src="passthrough.js"></script>
</body>
</html>
