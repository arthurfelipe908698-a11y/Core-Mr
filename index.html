<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App VR - Realidade Mista & Mãos</title>
    <!-- Importando A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
        /* Garante tela cheia e evita barras de rolagem ou zoom acidental */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: transparent;
        }
        /* Faz o 3D flutuar perfeitamente sobre a câmera do passthrough.js */
        .a-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 
      embedded -> Mantém o app integradinho na tela cheia
      vr-mode-ui="enabled: false" -> Remove a divisão de tela (dois olhos) e os botões de VR
    -->
    <a-scene embedded vr-mode-ui="enabled: false" stats="enabled: false">
        
        <!-- Câmera e Controles de Mão -->
        <a-entity id="rig">
            <a-camera position="0 1.6 0">
                <!-- Cursor centralizado para interação por olhar/toque -->
                <a-cursor raycaster="objects: [hand-interactive]" fuse="false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015" material="color: white; shader: flat"></a-cursor>
            </a-camera>
            
            <a-entity id="leftHand" hand-tracking-controls="hand: left"></a-entity>
            <a-entity id="rightHand" hand-tracking-controls="hand: right"></a-entity>
        </a-entity>

        <!-- Objeto 3D Interativo (Cubo Principal) -->
        <a-box id="cuboPrincipal" position="0 1.6 -1.5" rotation="0 45 45" color="#4CC3D9" shadow 
               hand-interactive
               animation="property: rotation; to: 360 360 0; loop: true; dur: 10000">
        </a-box>

        <!-- Interface Flutuante (HUD) -->
        <a-entity position="0 1.6 -1.5">
            <a-plane width="1.2" height="0.6" color="#000000" opacity="0.5" position="0 0 0"></a-plane>
            <a-text value="Mixed Reality Mode" align="center" position="0 0.2 0.01" scale="0.5 0.5 0.5" color="#FFF"></a-text>
            
            <!-- Botão Cor -->
            <a-box id="btnMudarCor" position="-0.3 -0.1 0.02" width="0.4" height="0.15" depth="0.05" color="#4CC3D9" hand-interactive>
                <a-text value="Cor" align="center" position="0 0 0.03" scale="0.4 0.4 0.4" color="#000"></a-text>
            </a-box>

            <!-- Botão Reset -->
            <a-box id="btnResetar" position="0.3 -0.1 0.02" width="0.4" height="0.15" depth="0.05" color="#EF2D5E" hand-interactive>
                <a-text value="Reset" align="center" position="0 0 0.03" scale="0.4 0.4 0.4" color="#FFF"></a-text>
            </a-box>
        </a-entity>

        <!-- Iluminação -->
        <a-light type="ambient" color="#BBB"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="-0.5 1 1"></a-light>
    </a-scene>

    <!-- Mantém os scripts externos funcionando exatamente como estavam -->
    <script src="interaction.js"></script>
    <script src="passthrough.js"></script>
</body>
</html>
