<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App VR - Realidade Mista & Mãos</title>
    <!-- Importando A-Frame e componentes de WebXR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: hand-tracking;">
        
        <!-- Câmera e Controladores de Mão -->
        <a-entity id="rig">
            <a-camera position="0 1.6 0">
                <!-- Cursor para toque/olhar caso o hand tracking precise de um apoio -->
                <a-cursor raycaster="objects: [hand-interactive]"></a-cursor>
            </a-camera>
            
            <a-entity id="leftHand" hand-tracking-controls="hand: left"></a-entity>
            <a-entity id="rightHand" hand-tracking-controls="hand: right"></a-entity>
        </a-entity>

        <!-- Objeto 3D Interativo no Ambiente -->
        <a-box id="cuboPrincipal" position="0 1.5 -1" rotation="0 45 45" color="#4CC3D9" shadow 
               hand-interactive
               animation="property: rotation; to: 360 360 0; loop: true; dur: 10000">
        </a-box>

        <!-- Interface Flutuante (HUD) -->
        <a-entity position="0 1.6 -1.5">
            <a-plane width="1.2" height="0.6" color="#000000" opacity="0.6" position="0 0 0"></a-plane>
            <a-text value="VR Box Mixed Reality" align="center" position="0 0.2 0.01" scale="0.5 0.5 0.5" color="#FFF"></a-text>
            
            <!-- Botão Cor -->
            <a-box id="btnMudarCor" position="-0.3 -0.1 0.02" width="0.4" height="0.15" depth="0.05" color="#4CC3D9" hand-interactive>
                <a-text value="Cor" align="center" position="0 0 0.03" scale="0.4 0.4 0.4" color="#000"></a-text>
            </a-box>

            <!-- Botão Reset -->
            <a-box id="btnResetar" position="0.3 -0.1 0.02" width="0.4" height="0.15" depth="0.05" color="#EF2D5E" hand-interactive>
                <a-text value="Reset" align="center" position="0 0 0.03" scale="0.4 0.4 0.4" color="#FFF"></a-text>
            </a-box>
        </a-entity>

        <!-- Iluminação e Chão -->
        <a-light type="ambient" color="#BBB"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="-0.5 1 1"></a-light>
        <a-plane position="0 0 -1" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    </a-scene>

    <!-- Importando os scripts criados separadamente -->
    <script src="interaction.js"></script>
    <script src="passthrough.js"></script>
</body>
</html>
