<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ======================================================================== -->
    <!-- METADADOS E CONFIGURAÇÕES INICIAIS DA PÁGINA WEB PARA O APLICATIVO VR/MR -->
    <!-- ======================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>App VR - Realidade Mista & Hand Tracking Avançado</title>

    <!-- Importação do framework A-Frame otimizado para gráficos 3D na Web -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- ======================================================================== -->
    <!-- FOLHA DE ESTILOS CSS INTERNA PARA CONTROLE DE TELA CHEIA E INTERFACES -->
    <!-- ======================================================================== -->
    <style>
        /* Resfriamento de margens e preenchimentos globais do documento */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Ocultação forçada de elementos padrões indesejados gerados pelo WebXR */
        .a-enter-vr, 
        .a-enter-vr-modal, 
        .a-modal, 
        .a-orientation-warning {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Camada de sobreposição para logs de depuração em tempo de execução mobile */
        #debug-overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00FF00;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-size: 11px;
            z-index: 99999;
            border-radius: 4px;
            pointer-events: none;
            display: block;
            border: 1px solid #00FF00;
        }

        /* Estilização da tela de carregamento inicial */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111111;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento Customizada -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Carregando Realidade Mista...</h2>
        <p>Ajuste seu celular no VR Box e aguarde a permissão da câmera.</p>
    </div>

    <!-- Painel flutuante de informações e depuração em tempo de execução -->
    <div id="debug-overlay">Status: Inicializando Câmera e WebXR...</div>

    <!-- ======================================================================== -->
    <!-- CENA PRINCIPAL DO A-FRAME COM SUPORTE A REALIDADE MISTA E MÃOS -->
    <!-- ======================================================================== -->
    <a-scene 
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: hand-tracking, dom-overlay;" 
        vr-mode-ui="enabled: true"
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;">

        <!-- Definição dos recursos e ativos visuais reutilizáveis -->
        <a-assets>
            <mixin id="ui-panel-style" geometry="primitive: plane; width: 1.2; height: 0.6" material="color: #000000; opacity: 0.65; shader: flat"></mixin>
            <mixin id="button-style" geometry="primitive: box; width: 0.4; height: 0.15; depth: 0.05" material="shader: flat"></mixin>
        </a-assets>

        <!-- Rig de Câmera e Controladores Biométricos de Mãos -->
        <a-entity id="rig" position="0 0 0">
            <!-- Câmera principal posicionada na altura dos olhos do usuário virtual -->
            <a-camera id="camera" position="0 1.6 0" look-controls="enabled: true"></a-camera>
            
            <!-- Controlador da Mão Esquerda com rastreamento via esqueleto -->
            <a-entity id="leftHand" 
                      hand-tracking-controls="hand: left; modelStyle: mesh;" 
                      hand-skeleton-color="color: #FFFFFF">
            </a-entity>
            
            <!-- Controlador da Mão Direita com rastreamento via esqueleto -->
            <a-entity id="rightHand" 
                      hand-tracking-controls="hand: right; modelStyle: mesh;" 
                      hand-skeleton-color="color: #FFFFFF">
            </a-entity>
        </a-entity>

        <!-- ==================================================================== -->
        <!-- INTERFACE FLUTUANTE DE BOTÕES (HUD) PARA O AMBIENTE DE REALIDADE MISTA -->
        <!-- ==================================================================== -->
        <a-entity id="hud-interface" position="0 1.6 -1.2" rotation="0 0 0">
            <!-- Fundo preto translúcido do painel -->
            <a-plane mixin="ui-panel-style" position="0 0 0"></a-plane>
            
            <!-- Título descritivo flutuante -->
            <a-text value="VR Box Mixed Reality - Hand Tracking" 
                    align="center" 
                    position="0 0.2 0.01" 
                    scale="0.35 0.35 0.35" 
                    color="#FFFFFF">
            </a-text>
            
            <!-- Botão Interativo 1: Mudar Cor do Sistema -->
            <a-entity id="btnMudarCor" position="-0.3 -0.1 0.02" mixin="button-style" material="color: #4CC3D9" advanced-interactive>
                <a-text value="Mudar Cor" align="center" position="0 0 0.03" scale="0.3 0.3 0.3" color="#000000"></a-text>
            </a-entity>

            <!-- Botão Interativo 2: Resetar Configurações -->
            <a-entity id="btnResetar" position="0.3 -0.1 0.02" mixin="button-style" material="color: #EF2D5E" advanced-interactive>
                <a-text value="Resetar" align="center" position="0 0 0.03" scale="0.3 0.3 0.3" color="#FFFFFF"></a-text>
            </a-entity>
        </a-entity>

        <!-- ==================================================================== -->
        <!-- SISTEMA DE ILUMINAÇÃO AVANÇADO PARA AS MÃOS E OBJETOS VIRTUAIS     -->
        <!-- ==================================================================== -->
        <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="0.7" position="-1 2 1"></a-light>
        <a-light type="point" color="#4CC3D9" intensity="0.5" position="0 2 -1"></a-light>
    </a-scene>

    <!-- ======================================================================== -->
    <!-- SCRIPTS DE SUPORTE E MANIPULAÇÃO DO DOM EM TEMPO DE EXECUÇÃO            -->
    <!-- ======================================================================== -->
    <script>
        // Função global utilitária para registrar logs no painel visual mobile
        function updateDebugLog(message) {
            const debugEl = document.getElementById('debug-overlay');
            if (debugEl) {
                debugEl.innerText = "Status: " + message;
            }
            console.log("[MR-App]: " + message);
        }

        // Evento executado quando o documento HTML estiver completamente carregado
        document.addEventListener('DOMContentLoaded', () => {
            updateDebugLog("DOM carregado. Aguardando motores WebXR...");

            // Temporizador para esconder a tela de carregamento após a inicialização
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.style.display = 'none', 500);
                }
                updateDebugLog("Pronto para uso em Realidade Mista.");
            }, 2500);

            // Loop contínuo de verificação e coloração forçada do esqueleto das mãos para BRANCO
            setInterval(() => {
                // Remove popups e avisos de 3DoF incômodos gerados pelo navegador
                document.querySelectorAll('.a-modal, div[id^="aframe-"]:not(canvas)').forEach(el => {
                    if (el.innerText && (el.innerText.includes('3DoF') || el.innerText.includes('Continuar') || el.innerText.includes('VR'))) {
                        el.style.display = 'none';
                    }
                });

                // Varre as mãos esquerda e direita para injetar material/cor branca em cada osso/malha
                const handIds = ['leftHand', 'rightHand'];
                handIds.forEach(id => {
                    const handElement = document.querySelector('#' + id);
                    if (handElement && handElement.object3D) {
                        handElement.object3D.traverse((node) => {
                            if (node.isMesh) {
                                if (node.material) {
                                    // Força a cor branca brilhante para destacar perfeitamente no Passthrough
                                    node.material.color.set('#FFFFFF');
                                    node.material.emissive.set('#222222');
                                    node.material.roughness = 0.2;
                                    node.material.metalness = 0.8;
                                }
                            }
                        });
                    }
                });
            }, 300);
        });
    </script>

    <!-- Importação dos scripts modulares externos solicitados -->
    <script src="interaction.js"></script>
    <script src="passthrough.js"></script>
</body>
    </html>
